<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>爆炸頭紅魚的深海冒險 (Flappy Afro RedFish)</title>
    <style>
        /* 基礎樣式重設，確保在行動裝置與桌面端都能完美呈現 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030519;
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 遊戲容器：自適應螢幕比例 */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100%;
            max-height: 850px;
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
            overflow: hidden;
            border-radius: 12px;
            background: linear-gradient(to bottom, #050c26, #01133a, #000817);
        }

        /* 畫布樣式 */
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* UI 介面層 */
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }

        /* 隱藏不必要的 UI 狀態 */
        .hidden {
            display: none !important;
        }

        /* 標題與文字特效 */
        h1 {
            font-size: 2.2rem;
            color: #ff3366;
            text-shadow: 0 0 10px #ff3366, 0 0 20px #ff0000;
            margin-bottom: 10px;
            animation: pulse 1.5s infinite alternate;
        }
        
        .subtitle {
            font-size: 1rem;
            color: #00d4ff;
            margin-bottom: 40px;
            text-shadow: 0 0 5px #00d4ff;
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 20px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        /* 華麗的互動按鈕 */
        .btn {
            padding: 14px 40px;
            font-size: 1.3rem;
            font-weight: bold;
            color: #ffffff;
            background: linear-gradient(45deg, #ff0055, #ff5500);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.6);
            transition: transform 0.1s, box-shadow 0.2s;
            outline: none;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.9);
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* 遊戲內即時資訊顯示 (頂部狀態欄) */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 5;
            pointer-events: none; /* 讓點擊穿透 HUD，不影響遊戲操作 */
        }

        .hud-item {
            font-size: 1.2rem;
            font-weight: bold;
            color: #fff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        #score-display {
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255,215,0,0.5);
            font-size: 1.5rem;
        }

        /* 生命值愛心動畫 */
        .heart {
            color: #ff3366;
            display: inline-block;
            animation: heartBeat 0.3s ease-out;
        }

        /* 道具狀態提示條 */
        #buff-container {
            position: absolute;
            top: 60px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 5;
            pointer-events: none;
        }

        .buff-badge {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
            color: white;
            animation: slideIn 0.3s ease-out;
        }

        /* 閃爍與動畫特效定義 */
        @keyframes pulse {
            from { transform: scale(0.98); text-shadow: 0 0 10px #ff3366, 0 0 20px #ff0000; }
            to { transform: scale(1.02); text-shadow: 0 0 15px #ff3366, 0 0 35px #ff0055, 0 0 50px #ff0000; }
        }
        @keyframes heartBeat {
            0% { transform: scale(1); }
            50% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        @keyframes slideIn {
            from { transform: translateX(-20px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- 遊戲即時數據顯示欄 (HUD) -->
        <div id="hud">
            <div class="hud-item" id="health-display">生命: <span class="heart">❤️</span><span id="health-count">3</span></div>
            <div class="hud-item" id="score-display">分數: 0</div>
        </div>

        <!-- 道具持續時間顯示 -->
        <div id="buff-container"></div>

        <!-- 遊戲繪圖畫布 -->
        <canvas id="gameCanvas"></canvas>

        <!-- 開始畫面 UI -->
        <div id="start-screen" class="ui-layer">
            <h1>爆炸頭紅魚<br>深海大冒險</h1>
            <div class="subtitle">Flappy Afro RedFish</div>
            <p>點擊螢幕或按空白鍵讓紅魚游動<br>避開障礙物並收集發光寶物！</p>
            <button class="btn" id="start-btn">開始冒險</button>
        </div>

        <!-- 結束與結算畫面 UI -->
        <div id="gameover-screen" class="ui-layer hidden">
            <h1 style="color: #ff3333; text-shadow: 0 0 10px #ff3333;">冒險結束</h1>
            <p id="final-score" style="font-size: 1.4rem; color: #ffd700;">最終得分: 0</p>
            <p style="font-size: 0.9rem; color: #aaa;">點擊下方按鈕重新出發</p>
            <button class="btn" id="restart-btn">再次挑戰</button>
        </div>
    </div>

    <script>
        /**
         * ==========================================
         * 爆炸頭紅魚 Flappy Bird 遊戲核心程式碼 (純Web Audio與Canvas繪製)
         * ==========================================
         * 為了讓讀者方便學習，全程式採用原生 JavaScript 編寫，
         * 音效與音樂皆使用 Web Audio API 即時運算合成，免去外部音檔載入失敗的風險！
         */

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const startScreen = document.getElementById('start-screen');
        const gameoverScreen = document.getElementById('gameover-screen');
        const startBtn = document.getElementById('start-btn');
        const restartBtn = document.getElementById('restart-btn');
        const scoreDisplay = document.getElementById('score-display');
        const healthCount = document.getElementById('health-count');
        const buffContainer = document.getElementById('buff-container');

        // 遊戲狀態控制
        let gameState = 'START'; // START, PLAYING, GAMEOVER
        let score = 0;
        let animationFrameId;

        // 畫布尺寸響應式調整
        function resizeCanvas() {
            const container = document.getElementById('game-container');
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // ==========================================
        // 1. WEB AUDIO API 音效合成器系統
        // ==========================================
        class SoundSystem {
            constructor() {
                this.ctx = null;
                this.bgmInterval = null;
            }

            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }

            // 播放跳躍/游動音效 (頻率向上滑動)
            playSwim() {
                this.init();
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(400, this.ctx.currentTime + 0.15);

                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.15);
            }

            // 播放得分/吃到道具音效 (和弦效果)
            playCoin() {
                this.init();
                [523.25, 659.25, 783.99].forEach((freq, index) => {
                    let osc = this.ctx.createOscillator();
                    let gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + index * 0.05);
                    gain.gain.setValueAtTime(0.1, this.ctx.currentTime + index * 0.05);
                    gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + index * 0.05 + 0.2);

                    osc.start(this.ctx.currentTime + index * 0.05);
                    osc.stop(this.ctx.currentTime + index * 0.05 + 0.2);
                });
            }

            // 播放受傷音效 (頻率急遽向下滑動)
            playHit() {
                this.init();
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(60, this.ctx.currentTime + 0.3);

                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.3);
            }

            // 播放獲得護盾/特殊道具音效
            playShield() {
                this.init();
                let osc = this.ctx.createOscillator();
                let gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);

                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(800, this.ctx.currentTime + 0.4);

                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);

                osc.start();
                osc.stop(this.ctx.currentTime + 0.4);
            }

            // 循環節奏藍調電子 BGM 基底
            startBGM() {
                this.init();
                if (this.bgmInterval) clearInterval(this.bgmInterval);

                let beat = 0;
                // 簡單的復古 8-bit 深海旋律
                const melody = [261.63, 293.66, 329.63, 392.00, 329.63, 293.66, 261.63, 196.00];

                this.bgmInterval = setInterval(() => {
                    if (gameState !== 'PLAYING') return;

                    let osc = this.ctx.createOscillator();
                    let gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.type = 'triangle';
                    // 根據節拍輪流播放低音與主旋律
                    if (beat % 2 === 0) {
                        osc.frequency.setValueAtTime(melody[beat % melody.length], this.ctx.currentTime);
                        gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
                    } else {
                        osc.frequency.setValueAtTime(melody[(beat + 2) % melody.length] * 0.5, this.ctx.currentTime);
                        gain.gain.setValueAtTime(0.06, this.ctx.currentTime);
                    }

                    gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.25);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.25);

                    beat++;
                }, 300); // 每 300 毫秒一拍
            }

            stopBGM() {
                if (this.bgmInterval) {
                    clearInterval(this.bgmInterval);
                    this.bgmInterval = null;
                }
            }
        }

        const sound = new SoundSystem();


        // ==========================================
        // 2. 遊戲物件與實體定義 (主角、障礙物、道具、粒子)
        // ==========================================

        // 主角：爆炸頭紅魚
        class RedFish {
            constructor() {
                this.x = 80;
                this.y = 300;
                this.radius = 16;
                this.velocity = 0;
                this.gravity = 0.4;
                this.jumpStrength = -6.5;
                this.health = 3;
                this.maxHealth = 5;
                
                // 狀態效果計時器 (單位：幀數，約60幀=1秒)
                this.invincibleTimer = 0; // 受傷無敵時間
                this.shieldTimer = 0;     // 護盾道具
                this.magnetTimer = 0;     // 磁鐵道具
                this.scoreMultiplierTimer = 0; // 雙倍得分道具

                // 動畫輔助
                this.angle = 0;
                this.wobble = 0;
            }

            update() {
                // 套用重力
                this.velocity += this.gravity;
                this.y += this.velocity;

                // 根據速度計算魚頭傾斜角度，讓游動更生動
                this.angle = Math.min(Math.PI / 4, Math.max(-Math.PI / 7, this.velocity * 0.06));

                // 限制天花板與地板邊界
                if (this.y - this.radius < 0) {
                    this.y = this.radius;
                    this.velocity = 0;
                }
                if (this.y + this.radius > canvas.height - 40) { // 留出40px給海底裝飾線
                    this.y = canvas.height - 40 - this.radius;
                    this.velocity = 0;
                }

                // 減少各式狀態計時器
                if (this.invincibleTimer > 0) this.invincibleTimer--;
                if (this.shieldTimer > 0) this.shieldTimer--;
                if (this.magnetTimer > 0) this.magnetTimer--;
                if (this.scoreMultiplierTimer > 0) this.scoreMultiplierTimer--;

                this.wobble += 0.1; // 用於爆炸頭和魚尾的微幅晃動特效
            }

            swim() {
                this.velocity = this.jumpStrength;
                sound.playSwim();
                // 躍動時產生小水泡粒子
                for (let i = 0; i < 3; i++) {
                    particles.push(new Particle(this.x - 10, this.y, '#00d4ff', 'bubble'));
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);

                // 受傷閃爍效果
                if (this.invincibleTimer > 0 && Math.floor(this.invincibleTimer / 4) % 2 === 0) {
                    ctx.globalAlpha = 0.3;
                }

                // A. 繪製魚尾巴
                ctx.beginPath();
                ctx.fillStyle = '#ff3333';
                ctx.moveTo(-12, 0);
                const tailWobble = Math.sin(this.wobble) * 6;
                ctx.lineTo(-28, -12 + tailWobble);
                ctx.lineTo(-24, 0);
                ctx.lineTo(-28, 12 + tailWobble);
                ctx.closePath();
                ctx.fill();

                // B. 繪製圓滾滾的紅魚身體
                ctx.beginPath();
                let gradient = ctx.createRadialGradient(-4, -4, 2, 0, 0, this.radius);
                gradient.addColorStop(0, '#ff6666');
                gradient.addColorStop(0.8, '#cc0022');
                gradient.addColorStop(1, '#770000');
                ctx.fillStyle = gradient;
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fill();

                // C. 靈魂所在：華麗發光的【黑色爆炸頭】
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00d4ff'; // 爆炸頭邊緣帶點迷幻藍光
                ctx.fillStyle = '#111118';
                const afroSize = 15;
                // 用四個重疊的圓圈交織出有層次的蓬鬆爆炸頭
                ctx.beginPath(); ctx.arc(-8, -10, afroSize, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(4, -12, afroSize - 2, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(-14, 0, afroSize - 3, 0, Math.PI * 2); ctx.fill();
                ctx.beginPath(); ctx.arc(-4, -18, afroSize - 1, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0; // 還原陰影設定

                // D. 魚眼睛
                ctx.beginPath();
                ctx.fillStyle = '#ffffff';
                ctx.arc(8, -4, 5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.fillStyle = '#000000';
                ctx.arc(9, -4, 2.5, 0, Math.PI * 2);
                ctx.fill();

                // E. 魚鰭 (會隨著擺動晃動)
                ctx.beginPath();
                ctx.fillStyle = '#ff5555';
                ctx.ellipse(-2, 6, 4, 7, Math.PI / 4 + Math.sin(this.wobble)*0.2, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();

                // F. 外層特殊狀態特效圈 (不跟著魚隻旋轉，保持水平)
                if (this.shieldTimer > 0) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.strokeStyle = '#00ffff';
                    ctx.lineWidth = 3;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#00ffff';
                    ctx.arc(this.x, this.y, this.radius + 12, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }
                if (this.magnetTimer > 0) {
                    ctx.save();
                    ctx.beginPath();
                    ctx.strokeStyle = '#e066ff';
                    ctx.lineWidth = 1.5;
                    ctx.setLineDash([4, 4]); // 虛線磁場感
                    ctx.arc(this.x, this.y, 90, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.restore();
                }
            }
        }

        // 珊瑚礁管柱障礙物
        class Obstacle {
            constructor(x) {
                this.x = x;
                // 上下管子的間距，會隨著分數增加而縮小，提高遊戲難度！
                this.gap = Math.max(120, 190 - Math.floor(score / 5) * 8);
                this.width = 65;
                // 隨機決定黃金通道的中心點
                const minHeight = 80;
                const maxHeight = canvas.height - 40 - minHeight - this.gap;
                this.topHeight = minHeight + Math.random() * (maxHeight - minHeight);
                this.bottomY = this.topHeight + this.gap;
                this.passed = false;
                this.speed = 2.8 + Math.min(2.0, (score * 0.1)); // 隨分數微幅加速
            }

            update() {
                this.x -= this.speed;
            }

            draw() {
                // 使用華麗的漸層色繪製科幻感十足的發光海底能量柱
                let gradient = ctx.createLinearGradient(this.x, 0, this.x + this.width, 0);
                gradient.addColorStop(0, '#004b6e');
                gradient.addColorStop(0.3, '#00d4ff');
                gradient.addColorStop(0.7, '#0084b5');
                gradient.addColorStop(1, '#002b40');

                ctx.save();
                ctx.fillStyle = gradient;
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#00d4ff';

                // 上方管柱
                ctx.fillRect(this.x, 0, this.width, this.topHeight);
                // 上管柱突出的邊緣蓋子
                ctx.fillRect(this.x - 3, this.topHeight - 20, this.width + 6, 20);

                // 下方管柱
                ctx.fillRect(this.x, this.bottomY, this.width, canvas.height - 40 - this.bottomY);
                // 下管柱突出的邊緣蓋子
                ctx.fillRect(this.x - 3, this.bottomY, this.width + 6, 20);

                ctx.restore();
            }
        }

        // 豐富的道具系統定義
        const ITEM_TYPES = {
            HEART: { color: '#ff3366', label: '❤️ 補血', weight: 0.2 },
            SHIELD: { color: '#00ffff', label: '🛡️ 護盾', weight: 0.25 },
            MAGNET: { color: '#e066ff', label: '🧲 磁鐵', weight: 0.25 },
            STAR: { color: '#ffd700', label: '⭐ 雙倍積分', weight: 0.3 }
        };

        class Item {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 12;
                this.speed = 2.8;
                this.wobble = Math.random() * Math.PI;

                // 權重隨機挑選道具類型
                const rand = Math.random();
                if (rand < 0.2) this.type = 'HEART';
                else if (rand < 0.45) this.type = 'SHIELD';
                else if (rand < 0.7) this.type = 'MAGNET';
                else this.type = 'STAR';

                this.config = ITEM_TYPES[this.type];
            }

            update() {
                // 道具本體向左移動
                this.x -= this.speed;
                // 道具自帶上下漂浮微幅動畫
                this.y += Math.sin(this.wobble) * 0.5;
                this.wobble += 0.05;

                // 磁鐵功能：當魚吃到了磁鐵，場上的道具會受到吸力飛向紅魚
                if (fish.magnetTimer > 0) {
                    const dx = fish.x - this.x;
                    const dy = fish.y - this.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < 180) { // 磁鐵吸引半徑
                        this.x += (dx / dist) * 5;
                        this.y += (dy / dist) * 5;
                    }
                }
            }

            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.fillStyle = this.config.color;
                ctx.shadowBlur = 12;
                ctx.shadowColor = this.config.color;
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();

                // 繪製內層核心白光，讓道具看起來在發光
                ctx.beginPath();
                ctx.fillStyle = '#ffffff';
                ctx.arc(this.x - 3, this.y - 3, this.radius * 0.4, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // 視覺華麗感的核心：粒子噴射特效系統
        class Particle {
            constructor(x, y, color, type = 'star') {
                this.x = x;
                this.y = y;
                this.color = color;
                this.type = type;
                this.radius = type === 'bubble' ? Math.random() * 4 + 1 : Math.random() * 3 + 1;
                // 隨機發散速度
                this.vx = (Math.random() - 0.5) * (type === 'bubble' ? 2 : 6);
                this.vy = (Math.random() - 0.5) * (type === 'bubble' ? -3 : 6);
                this.alpha = 1;
                this.decay = Math.random() * 0.02 + 0.015;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.type === 'bubble') {
                    this.vy -= 0.02; // 水泡會微微往上飄
                }
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.fillStyle = this.color;
                if (this.type === 'bubble') {
                    ctx.strokeStyle = this.color;
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.stroke();
                } else {
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }


        // ==========================================
        // 3. 遊戲環境群組實體與動態初始化
        // ==========================================
        let fish;
        let obstacles = [];
        let items = [];
        let particles = [];
        let obstacleSpawnTimer = 0;

        function initGame() {
            fish = new RedFish();
            obstacles = [];
            items = [];
            particles = [];
            score = 0;
            obstacleSpawnTimer = 0;
            scoreDisplay.innerText = `分數: ${score}`;
            healthCount.innerText = fish.health;
            buffContainer.innerHTML = '';
        }

        // 產生震撼的煙火粒子集束效果
        function createExplosion(x, y, color, count = 20) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color, 'star'));
            }
        }


        // ==========================================
        // 4. 碰撞偵測與核心邏輯運算
        // ==========================================
        function handleCollisions() {
            // A. 障礙物碰撞與得分偵測
            for (let obs of obstacles) {
                // 矩形與圓形的碰撞偵測
                const closestXTop = Math.max(obs.x, Math.min(fish.x, obs.x + obs.width));
                const closestYTop = Math.max(0, Math.min(fish.y, obs.topHeight));
                const distXTop = fish.x - closestXTop;
                const distYTop = fish.y - closestYTop;
                const hitTop = (distXTop * distXTop + distYTop * distYTop) < (fish.radius * fish.radius);

                const closestXBot = Math.max(obs.x, Math.min(fish.x, obs.x + obs.width));
                const closestYBot = Math.max(obs.bottomY, Math.min(fish.y, canvas.height - 40));
                const distXBot = fish.x - closestXBot;
                const distYBot = fish.y - closestYBot;
                const hitBot = (distXBot * distXBot + distYBot * distYBot) < (fish.radius * fish.radius);

                if (hitTop || hitBot) {
                    // 若無敵時間或有護盾，則免受傷害
                    if (fish.invincibleTimer === 0) {
                        if (fish.shieldTimer > 0) {
                            fish.shieldTimer = 0; // 護盾抵消
                            fish.invincibleTimer = 60; // 給予1秒無敵緩衝
                            sound.playHit();
                            createExplosion(fish.x, fish.y, '#00ffff', 25);
                        } else {
                            fish.health--;
                            fish.invincibleTimer = 75; // 1.25秒無敵
                            healthCount.innerText = fish.health;
                            sound.playHit();
                            createExplosion(fish.x, fish.y, '#ff3333', 30);

                            if (fish.health <= 0) {
                                endGame();
                                return;
                            }
                        }
                    }
                }

                // 成功穿越加分
                if (!obs.passed && obs.x + obs.width < fish.x) {
                    obs.passed = true;
                    let gainedScore = fish.scoreMultiplierTimer > 0 ? 2 : 1;
                    score += gainedScore;
                    scoreDisplay.innerText = `分數: ${score}`;
                    sound.playCoin();
                    
                    // 穿越成功的亮點特效
                    createExplosion(fish.x, fish.y, '#ffd700', 8);
                }
            }

            // B. 道具拾取偵測
            for (let i = items.length - 1; i >= 0; i--) {
                const item = items[i];
                const dx = fish.x - item.x;
                const dy = fish.y - item.y;
                const dist = Math.sqrt(dx*dx + dy*dy);

                if (dist < fish.radius + item.radius) {
                    // 吃到道具發動對應效果
                    createExplosion(item.x, item.y, item.config.color, 15);
                    
                    if (item.type === 'HEART') {
                        if (fish.health < fish.maxHealth) fish.health++;
                        healthCount.innerText = fish.health;
                        sound.playCoin();
                    } else if (item.type === 'SHIELD') {
                        fish.shieldTimer = 450; // 7.5 秒
                        sound.playShield();
                    } else if (item.type === 'MAGNET') {
                        fish.magnetTimer = 500; // 8.3 秒
                        sound.playShield();
                    } else if (item.type === 'STAR') {
                        fish.scoreMultiplierTimer = 400; // 6.6 秒
                        sound.playShield();
                    }

                    items.splice(i, 1);
                }
            }
        }

        // 更新頂部道具狀態 Badge 顯示
        function updateBuffUI() {
            buffContainer.innerHTML = '';
            if (fish.shieldTimer > 0) {
                createBuffBadge('🛡️ 護盾中 ' + Math.ceil(fish.shieldTimer/60) + 's', '#00ffff');
            }
            if (fish.magnetTimer > 0) {
                createBuffBadge('🧲 磁力中 ' + Math.ceil(fish.magnetTimer/60) + 's', '#e066ff');
            }
            if (fish.scoreMultiplierTimer > 0) {
                createBuffBadge('⭐ 雙倍得分 ' + Math.ceil(fish.scoreMultiplierTimer/60) + 's', '#ffd700');
            }
        }

        function createBuffBadge(text, color) {
            const badge = document.createElement('div');
            badge.className = 'buff-badge';
            badge.style.backgroundColor = color;
            badge.style.boxShadow = `0 0 8px ${color}`;
            badge.innerText = text;
            buffContainer.appendChild(badge);
        }


        // ==========================================
        // 5. 遊戲主迴圈與渲染繪製 (Main Game Loop)
        // ==========================================
        function gameLoop() {
            // A. 清除畫布並繪製動態深海背景
            ctx.fillStyle = '#010c22';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 繪製背景微弱的環境裝飾水泡
            if (Math.random() < 0.04) {
                particles.push(new Particle(Math.random() * canvas.width, canvas.height - 45, '#00d4ff', 'bubble'));
            }

            // B. 實體狀態更新與渲染
            fish.update();
            fish.draw();

            // 處理障礙物與道具生成邏輯
            obstacleSpawnTimer++;
            // 每隔固定幀數產生一個新的水柱障礙物
            if (obstacleSpawnTimer >= 110) {
                obstacles.push(new Obstacle(canvas.width + 50));
                obstacleSpawnTimer = 0;

                // 機率性伴隨障礙物產生一個漂浮道具，通常位於安全通道內
                if (Math.random() < 0.6) {
                    const lastObs = obstacles[obstacles.length - 1];
                    const itemY = lastObs.topHeight + lastObs.gap / 2 + (Math.random() - 0.5) * 40;
                    items.push(new Item(canvas.width + 180, itemY));
                }
            }

            // 迭代障礙物柱子
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].update();
                obstacles[i].draw();
                if (obstacles[i].x + obstacles[i].width < 0) {
                    obstacles.splice(i, 1);
                }
            }

            // 迭代道具
            for (let i = items.length - 1; i >= 0; i--) {
                items[i].update();
                items[i].draw();
                if (items[i].x + 20 < 0) {
                    items.splice(i, 1);
                }
            }

            // 迭代華麗粒子特效
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            // C. 碰撞核心處理
            handleCollisions();

            // D. UI 狀態即時刷新
            updateBuffUI();

            // 繪製最底層的裝飾沙灘線
            ctx.fillStyle = '#001a4d';
            ctx.fillRect(0, canvas.height - 40, canvas.width, 40);
            ctx.fillStyle = '#00d4ff';
            ctx.fillRect(0, canvas.height - 40, canvas.width, 2);

            // 只要不是結束狀態，就持續循環執行
            if (gameState === 'PLAYING') {
                animationFrameId = requestAnimationFrame(gameLoop);
            }
        }


        // ==========================================
        // 6. 遊戲流程切換控制
        // ==========================================
        function startGame() {
            sound.init();
            gameState = 'PLAYING';
            startScreen.classList.add('hidden');
            gameoverScreen.classList.add('hidden');
            initGame();
            sound.startBGM();
            gameLoop();
        }

        function endGame() {
            gameState = 'GAMEOVER';
            sound.stopBGM();
            cancelAnimationFrame(animationFrameId);
            document.getElementById('final-score').innerText = `最終得分: ${score}`;
            gameoverScreen.classList.remove('hidden');
        }


        // ==========================================
        // 7. 異步輸入與響應式事件監聽
        // ==========================================
        
        // 點擊事件監聽
        startBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // 防止冒泡觸發游動
            startGame();
        });

        restartBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            startGame();
        });

        // 點擊畫布任何地方皆視為游動指令 (完美支援手機觸控)
        window.addEventListener('touchstart', (e) => {
            if (gameState === 'PLAYING') {
                fish.swim();
                e.preventDefault(); // 防止手機端點擊延遲
            }
        }, { passive: false });

        window.addEventListener('mousedown', (e) => {
            // 如果點擊目標是按鈕本身，則不重複發送游動指令
            if (e.target.tagName === 'BUTTON') return;
            if (gameState === 'PLAYING') {
                fish.swim();
            }
        });

        // 鍵盤空白鍵監聽 (支援電腦端玩家)
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                if (gameState === 'PLAYING') {
                    fish.swim();
                } else if (gameState === 'START') {
                    startGame();
                } else if (gameState === 'GAMEOVER') {
                    startGame();
                }
                e.preventDefault(); // 防止空白鍵捲動網頁
            }
        });

        // 初始化靜態繪圖，在開始畫面前先繪製一個亮眼的主角供展示
        initGame();
        fish.draw();

    </script>
</body>
